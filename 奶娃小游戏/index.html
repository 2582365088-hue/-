<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奶娃接奶奶 🥛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #2a1f3d;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  canvas {
    display: block;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="480" height="720"></canvas></div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- 自适应缩放 ----------
function fit() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
}
window.addEventListener('resize', fit); fit();

// ---------- 加载素材 ----------
let naiwaImg = new Image();
let naiwaReady = false;
naiwaImg.onload = () => { naiwaReady = true; };
naiwaImg.src = 'naiwa_alpha.png';

let doubaoImg = new Image();
let doubaoReady = false;
doubaoImg.onload = () => { doubaoReady = true; };
doubaoImg.src = 'doubao.png';

let hugImg = new Image();
let hugReady = false;
hugImg.onload = () => { hugReady = true; };
hugImg.src = 'hug.png';

// ---------- 设置（localStorage） ----------
const defaultSettings = {
  difficulty: 'normal',
  sound: true,
  shake: true,
};
let settings = Object.assign({}, defaultSettings);
try {
  const s = JSON.parse(localStorage.getItem('naiwa_settings') || '{}');
  settings = Object.assign(settings, s);
} catch(e) {}
function saveSettings() {
  localStorage.setItem('naiwa_settings', JSON.stringify(settings));
}

// ---------- 排行榜 top5 ----------
let leaderboard = [];
try { leaderboard = JSON.parse(localStorage.getItem('naiwa_board') || '[]'); } catch(e) {}
function saveBoard() { localStorage.setItem('naiwa_board', JSON.stringify(leaderboard)); }
function isHighScore(score) {
  if (score <= 0) return false;
  if (leaderboard.length < 5) return true;
  return score > leaderboard[leaderboard.length - 1].score;
}
function addToBoard(name, score) {
  leaderboard.push({ name: name || '匿名', score: score });
  leaderboard.sort((a, b) => b.score - a.score);
  leaderboard = leaderboard.slice(0, 5);
  saveBoard();
}

// ---------- 音效（Web Audio 合成） ----------
let audioCtx = null;
function beep(freq, dur, type, vol) {
  if (!settings.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.15, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}
const sfx = {
  good: () => beep(880, 0.12, 'sine', 0.12),
  bad:  () => beep(180, 0.3, 'sawtooth', 0.2),
  doubao: () => { beep(523,0.1); setTimeout(()=>beep(659,0.1),100); setTimeout(()=>beep(784,0.15),200); },
  over: () => { beep(400,0.2); setTimeout(()=>beep(300,0.2),200); setTimeout(()=>beep(200,0.4),400); },
  click: () => beep(600, 0.06, 'square', 0.08),
};

// ---------- 游戏状态 ----------
const STATE = { MENU: 0, PLAYING: 1, OVER: 2, SETTINGS: 3, BOARD: 4, NAMEINPUT: 5 };
let state = STATE.MENU;
let score = 0;
let lives = 3;
let elapsed = 0;
let spawnTimer = 0;
let spawnInterval = 1.1;
let items = [];
let pops = [];
let shakes = 0;
let hurtFlash = 0;
let bounce = 0;
let playerX = W / 2;
let targetX = W / 2;

// 狂暴
let rage = 0;
const RAGE_DUR = 8;
// 拥抱动画：接到豆包时奶娃抱住豆包的短暂动作
let hugAnim = 0;
const HUG_DUR = 3.5;

// 难度参数
const DIFF = {
  easy:   { speedMul: 0.8,  spawnMul: 1.25, bombW: 0.6 },
  normal: { speedMul: 1.0,  spawnMul: 1.0,  bombW: 1.0 },
  hard:   { speedMul: 1.25, spawnMul: 0.8,  bombW: 1.5 },
};

// 掉落物
const TYPES = [
  { emoji: '🍼', score: 10, speed: 2.2, weight: 30 },
  { emoji: '🍪', score: 5,  speed: 2.6, weight: 25 },
  { emoji: '🧀', score: 15, speed: 2.0, weight: 15 },
  { emoji: '🍼', score: 10, speed: 2.8, weight: 15 },
  { emoji: '💣', score: 0,  speed: 3.2, weight: 12, bad: true },
  { emoji: '👟', score: 0,  speed: 3.0, weight: 8,  bad: true },
  { emoji: '🫘', score: 50, speed: 2.5, weight: 3, doubao: true },
];

let buttons = [];

// ---------- 输入 ----------
function moveTo(clientX) {
  const rect = canvas.getBoundingClientRect();
  const x = (clientX - rect.left) / rect.width * W;
  targetX = Math.max(50, Math.min(W - 50, x));
}
canvas.addEventListener('mousemove', e => { if (state === STATE.PLAYING) moveTo(e.clientX); });
canvas.addEventListener('touchmove', e => {
  if (state === STATE.PLAYING) { e.preventDefault(); moveTo(e.touches[0].clientX); }
}, { passive: false });

canvas.addEventListener('mousedown', e => {
  const rect = canvas.getBoundingClientRect();
  handleClick((e.clientX-rect.left)/rect.width*W, (e.clientY-rect.top)/rect.height*H);
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  handleClick((t.clientX-rect.left)/rect.width*W, (t.clientY-rect.top)/rect.height*H);
}, { passive: false });

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (state === STATE.MENU && (e.key === ' ' || e.key === 'Enter')) startGame();
  else if (state === STATE.OVER && (e.key === ' ' || e.key === 'Enter')) {
    if (isHighScore(score)) state = STATE.NAMEINPUT; else startGame();
  } else if ((state === STATE.SETTINGS || state === STATE.BOARD) && (e.key === 'Escape' || e.key === 'Backspace')) {
    state = STATE.MENU;
  }
});
window.addEventListener('keyup', e => keys[e.key] = false);

// 名字输入
let nameInput = '';
window.addEventListener('keypress', e => {
  if (state === STATE.NAMEINPUT) {
    if (e.key === 'Enter') {
      addToBoard(nameInput, score);
      nameInput = ''; state = STATE.BOARD; sfx.click();
    } else if (/^[a-zA-Z0-9\u4e00-\u9fa5 ]$/.test(e.key) && nameInput.length < 10) {
      nameInput += e.key;
    }
  }
});
window.addEventListener('keydown', e => {
  if (state === STATE.NAMEINPUT && e.key === 'Backspace') nameInput = nameInput.slice(0, -1);
});

// ---------- 按钮 ----------
function hitBtn(x, y) {
  for (const b of buttons) if (x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h) return b;
  return null;
}
function handleClick(x, y) {
  if (state === STATE.PLAYING) return;
  const b = hitBtn(x, y);
  if (!b) return;
  sfx.click();
  switch(b.id) {
    case 'start': startGame(); break;
    case 'settings': state = STATE.SETTINGS; break;
    case 'board': state = STATE.BOARD; break;
    case 'back': state = STATE.MENU; break;
    case 'diff_easy': settings.difficulty='easy'; saveSettings(); break;
    case 'diff_normal': settings.difficulty='normal'; saveSettings(); break;
    case 'diff_hard': settings.difficulty='hard'; saveSettings(); break;
    case 'sound_on': settings.sound=true; saveSettings(); break;
    case 'sound_off': settings.sound=false; saveSettings(); break;
    case 'shake_on': settings.shake=true; saveSettings(); break;
    case 'shake_off': settings.shake=false; saveSettings(); break;
    case 'restart':
      if (isHighScore(score)) state = STATE.NAMEINPUT; else startGame();
      break;
    case 'menu': state = STATE.MENU; break;
    case 'submit_name':
      addToBoard(nameInput, score);
      nameInput = ''; state = STATE.BOARD;
      break;
  }
}

// ---------- 游戏逻辑 ----------
function startGame() {
  state = STATE.PLAYING;
  score = 0; lives = 3;
  elapsed = 0; spawnTimer = 0; spawnInterval = 1.1;
  items = []; pops = [];
  shakes = 0; hurtFlash = 0; bounce = 0; rage = 0;
  playerX = W / 2; targetX = W / 2;
}

function pickType() {
  const d = DIFF[settings.difficulty];
  const types = TYPES.map(t => {
    let w = t.weight;
    if (t.bad) w *= d.bombW;
    return { ...t, weight: w };
  });
  const total = types.reduce((s, t) => s + t.weight, 0);
  let r = Math.random() * total;
  for (const t of types) { r -= t.weight; if (r <= 0) return t; }
  return types[0];
}

function spawnItem() {
  items.push({
    x: 30 + Math.random() * (W - 60),
    y: -40,
    type: pickType(),
    rot: Math.random() * Math.PI * 2,
    rotSpd: (Math.random() - 0.5) * 0.08,
  });
}

function loseLife() {
  lives--;
  if (settings.shake) shakes = 60;  // 约1秒
  hurtFlash = 45;
  sfx.bad();
  if (lives <= 0) { state = STATE.OVER; sfx.over(); }
}

// ---------- 更新 ----------
let last = performance.now();
function update(dt) {
  if (state !== STATE.PLAYING) return;
  elapsed += dt;
  const d = DIFF[settings.difficulty];
  spawnInterval = Math.max(0.35, 1.1 - elapsed * 0.012) * d.spawnMul;
  if (rage > 0) rage -= dt;

  if (keys['ArrowLeft'] || keys['a']) targetX -= 380 * dt;
  if (keys['ArrowRight'] || keys['d']) targetX += 380 * dt;
  targetX = Math.max(50, Math.min(W - 50, targetX));
  playerX += (targetX - playerX) * Math.min(1, dt * 12);

  spawnTimer += dt;
  if (spawnTimer >= spawnInterval) { spawnTimer = 0; spawnItem(); }

  const groundY = H - 110;
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    const speedBoost = rage > 0 ? 1.3 : 1;
    it.y += it.type.speed * d.speedMul * (1 + elapsed * 0.02) * speedBoost * 60 * dt;
    it.rot += it.rotSpd;

    if (Math.abs(it.x - playerX) < 55 && it.y > groundY - 50 && it.y < groundY + 30) {
      if (it.type.doubao) {
        rage = RAGE_DUR;
        hugAnim = HUG_DUR;
        sfx.doubao();
        pops.push({ x: playerX, y: groundY - 90, text: '豆包附身! 狂暴!', color: '#ffd700', life: 1.5, big: true });
        items.splice(i, 1); continue;
      }
      if (it.type.bad) {
        if (rage > 0) {
          score += 20;
          pops.push({ x: it.x, y: it.y - 20, text: '反杀 +20', color: '#ffd700', life: 1 });
        } else {
          loseLife();
          pops.push({ x: playerX, y: groundY - 60, text: '哎呀!', color: '#ff5566', life: 1 });
        }
      } else {
        const mult = rage > 0 ? 3 : 1;
        const pts = it.type.score * mult;
        score += pts;
        bounce = 10;
        sfx.good();
        pops.push({ x: it.x, y: it.y - 20, text: '+' + pts, color: rage>0?'#ffd700':'#fff', life: 1 });
      }
      items.splice(i, 1); continue;
    }
    if (it.y > H + 40) items.splice(i, 1);
  }

  for (let i = pops.length - 1; i >= 0; i--) {
    pops[i].y -= 40 * dt;
    pops[i].life -= dt * 1.2;
    if (pops[i].life <= 0) pops.splice(i, 1);
  }

  if (bounce > 0) bounce--;
  if (hugAnim > 0) hugAnim -= dt;
}

// ---------- 绘制 ----------
function drawBackground() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  if (rage > 0) {
    g.addColorStop(0, '#3a1535'); g.addColorStop(0.6, '#7a2020'); g.addColorStop(1, '#ff6b35');
  } else {
    g.addColorStop(0, '#ffe8a3'); g.addColorStop(0.6, '#ffd3b0'); g.addColorStop(1, '#ffb88c');
  }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = rage>0 ? 'rgba(255,215,0,0.2)' : 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.moveTo(0, H-200);
  ctx.quadraticCurveTo(W*0.25, H-260, W*0.5, H-200);
  ctx.quadraticCurveTo(W*0.75, H-150, W, H-210);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();

  ctx.fillStyle = rage>0 ? '#c94f4f' : '#8bc34a';
  ctx.fillRect(0, H-90, W, 90);
}

function drawPlayer() {
  if (!naiwaReady) return;
  const groundY = H - 110;
  const bob = Math.sin(elapsed * (rage>0?10:4)) * (rage>0?5:3);
  const b = bounce>0 ? -Math.sin(bounce/10*Math.PI)*20 : 0;

  ctx.save();
  ctx.translate(playerX, groundY + bob + b);
  if (hurtFlash>0 && hurtFlash<12) ctx.rotate(Math.sin(hurtFlash)*0.15);

  if (hugAnim > 0 && hugReady) {
    // 拥抱图：整个角色换成"奶娃抱豆包"
    const hugSize = 150;
    ctx.globalAlpha = Math.min(1, hugAnim / 0.3);  // 开头淡入
    if (rage>0) { ctx.shadowColor='#ffd700'; ctx.shadowBlur=30; }
    ctx.drawImage(hugImg, -hugSize/2, -hugSize/2 - 10, hugSize, hugSize);
  } else {
    const size = rage>0 ? 130 : 110;
    if (rage>0) { ctx.shadowColor='#ffd700'; ctx.shadowBlur=30+Math.sin(elapsed*10)*10; }
    ctx.drawImage(naiwaImg, -size/2, -size/2-10, size, size);
  }
  ctx.restore();
}

function drawItems() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const it of items) {
    ctx.save();
    ctx.translate(it.x, it.y);
    if (it.type.doubao) {
      // 豆包：圆形头像图 + 金色光环 + 下方摆动的小手（伸手往下够）
      if (doubaoReady) {
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 20 + Math.sin(elapsed*8)*8;
        const size = 48;
        ctx.drawImage(doubaoImg, -size/2, -size/2, size, size);
        ctx.shadowBlur = 0;
        // 金色外圈
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, size/2 + 3, 0, Math.PI*2);
        ctx.stroke();
        // 下方摆动的小手，像在伸手够奶娃
        const handY = size/2 + 14 + Math.sin(elapsed*12)*4;
        ctx.font = '22px serif';
        ctx.fillText('👇', 0, handY);
      } else {
        ctx.font = '40px serif';
        ctx.fillText('🫘', 0, 0);
      }
    } else {
      ctx.rotate(it.rot);
      ctx.font = it.type.bad ? '34px serif' : '30px serif';
      if (it.type.bad && rage>0) ctx.globalAlpha = 0.5;
      ctx.fillText(it.type.emoji, 0, 0);
    }
    ctx.restore();
  }
}

function drawHUD() {
  ctx.fillStyle = rage>0 ? '#ffd700' : '#5d4037';
  ctx.font = 'bold 26px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('分数 ' + score, 18, 36);
  ctx.font = '14px -apple-system, "PingFang SC", sans-serif';
  ctx.fillStyle = rage>0 ? '#ffd700' : 'rgba(93,64,55,0.7)';
  ctx.fillText('最高 ' + (leaderboard[0] ? leaderboard[0].score : 0), 18, 60);

  ctx.font = '24px serif'; ctx.textAlign = 'right';
  let hearts = '';
  for (let i=0;i<3;i++) hearts += i<lives?'❤️':'🖤';
  ctx.fillText(hearts, W-18, 38);

  if (rage > 0) {
    const bw = 200, ratio = rage / RAGE_DUR;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(W/2-bw/2, 18, bw, 14);
    ctx.fillStyle = '#ffd700';
    ctx.fillRect(W/2-bw/2, 18, bw*ratio, 14);
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(W/2-bw/2, 18, bw, 14);
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 14px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🔥 狂暴 ' + rage.toFixed(1) + 's', W/2, 48);
  }

  for (const p of pops) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.color;
    ctx.font = p.big ? 'bold 28px -apple-system, "PingFang SC", sans-serif' : 'bold 22px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
    ctx.globalAlpha = 1;
  }
}

function button(id, x, y, w, h, label, active) {
  buttons.push({ id, x, y, w, h });
  ctx.fillStyle = active ? '#ff9800' : 'rgba(255,255,255,0.92)';
  ctx.strokeStyle = active ? '#e65100' : '#ccc';
  ctx.lineWidth = 2;
  roundRect(x, y, w, h, 10);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = active ? '#fff' : '#333';
  ctx.font = 'bold 18px -apple-system, "PingFang SC", sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x+w/2, y+h/2);
}
function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawMenu() {
  buttons = [];
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = 'bold 44px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText('奶娃接奶奶', W/2, H/2 - 160);
  ctx.font = '16px -apple-system, "PingFang SC", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('接 🍼🍪🧀  躲 💣👟', W/2, H/2 - 115);
  ctx.fillText('接到豆包头像 = 狂暴模式 8 秒！', W/2, H/2 - 90);

  const bw=200, bh=50;
  button('start', W/2-bw/2, H/2-50, bw, bh, '开始游戏', false);
  button('settings', W/2-bw/2, H/2+15, bw, bh, '⚙️ 设置', false);
  button('board', W/2-bw/2, H/2+80, bw, bh, '🏆 排行榜', false);

  if (leaderboard[0]) {
    ctx.fillStyle = '#ffd93d';
    ctx.font = '16px -apple-system, "PingFang SC", sans-serif';
    ctx.fillText('当前最高：' + leaderboard[0].score + ' 分', W/2, H/2+160);
  }
}

function drawOver() {
  buttons = [];
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#ff6b6b'; ctx.textAlign='center';
  ctx.font = 'bold 44px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText('游戏结束', W/2, H/2-120);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 30px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText('本局得分 ' + score, W/2, H/2-60);
  if (isHighScore(score)) {
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 18px -apple-system, "PingFang SC", sans-serif';
    ctx.fillText('🎉 新纪录！点击「再来一局」上榜', W/2, H/2-20);
  }
  const bw=200, bh=46;
  button('restart', W/2-bw/2, H/2+20, bw, bh, '再来一局', false);
  button('menu', W/2-bw/2, H/2+80, bw, bh, '返回菜单', false);
}

function drawNameInput() {
  buttons = [];
  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#ffd700'; ctx.textAlign='center';
  ctx.font = 'bold 26px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText('🏆 输入你的名字上榜', W/2, H/2-110);
  ctx.strokeStyle = '#ffd700'; ctx.lineWidth=2;
  ctx.strokeRect(W/2-130, H/2-60, 260, 60);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 32px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText(nameInput || '你的名字' + (nameInput?'':''), W/2, H/2-28);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.font = '14px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText('直接键盘输入，回车或点按钮确认', W/2, H/2+40);
  button('submit_name', W/2-100, H/2+70, 200, 46, '确认上榜', false);
}

function drawSettings() {
  buttons = [];
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#fff'; ctx.textAlign='center';
  ctx.font = 'bold 30px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText('⚙️ 设置', W/2, 90);

  ctx.textAlign='left';
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 18px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText('难度', 60, 160);
  button('diff_easy', 60, 180, 110, 40, '简单', settings.difficulty==='easy');
  button('diff_normal', 185, 180, 110, 40, '普通', settings.difficulty==='normal');
  button('diff_hard', 310, 180, 110, 40, '困难', settings.difficulty==='hard');

  ctx.fillStyle = '#ffd700';
  ctx.fillText('音效', 60, 260);
  button('sound_on', 60, 280, 110, 40, '开', settings.sound);
  button('sound_off', 185, 280, 110, 40, '关', !settings.sound);

  ctx.fillStyle = '#ffd700';
  ctx.fillText('屏幕震动', 60, 360);
  button('shake_on', 60, 380, 110, 40, '开', settings.shake);
  button('shake_off', 185, 380, 110, 40, '关', !settings.shake);

  button('back', W/2-100, H-90, 200, 46, '返回', false);
}

function drawBoard() {
  buttons = [];
  ctx.fillStyle = 'rgba(0,0,0,0.78)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#ffd700'; ctx.textAlign='center';
  ctx.font = 'bold 30px -apple-system, "PingFang SC", sans-serif';
  ctx.fillText('🏆 排行榜 TOP 5', W/2, 90);

  if (leaderboard.length === 0) {
    ctx.fillStyle = '#aaa';
    ctx.font = '16px -apple-system, "PingFang SC", sans-serif';
    ctx.fillText('还没有记录，快来玩第一局！', W/2, H/2);
  } else {
    const medals = ['🥇','🥈','🥉','4.','5.'];
    leaderboard.forEach((r, i) => {
      const y = 150 + i * 55;
      ctx.textAlign='left';
      ctx.fillStyle = i===0 ? '#ffd700' : '#fff';
      ctx.font = '22px serif';
      ctx.fillText(medals[i]||(i+1+'.'), 70, y);
      ctx.font = 'bold 18px -apple-system, "PingFang SC", sans-serif';
      ctx.fillText(r.name, 125, y);
      ctx.textAlign='right';
      ctx.font = '18px -apple-system, "PingFang SC", sans-serif';
      ctx.fillStyle = i===0 ? '#ffd700' : '#ccc';
      ctx.fillText(r.score + ' 分', W-70, y);
    });
  }
  button('back', W/2-100, H-90, 200, 46, '返回', false);
}

// ---------- 主循环 ----------
function loop(now) {
  const dt = Math.min(0.033, (now-last)/1000);
  last = now;
  update(dt);

  // 震动/红闪在任何状态下都衰减（游戏结束后也要停）
  if (shakes > 0) shakes = Math.max(0, shakes - dt * 60);
  if (hurtFlash > 0) hurtFlash = Math.max(0, hurtFlash - dt * 60);

  ctx.save();
  if (shakes>0 && settings.shake) {
    ctx.translate((Math.random()-0.5)*8, (Math.random()-0.5)*8);
  }
  drawBackground();
  if (state === STATE.PLAYING || state === STATE.OVER) {
    drawItems(); drawPlayer(); drawHUD();
  }
  if (state === STATE.MENU) drawMenu();
  else if (state === STATE.OVER) drawOver();
  else if (state === STATE.SETTINGS) drawSettings();
  else if (state === STATE.BOARD) drawBoard();
  else if (state === STATE.NAMEINPUT) drawNameInput();

  if (hurtFlash > 0) {
    ctx.fillStyle = 'rgba(255,0,0,' + (hurtFlash/30) + ')';
    ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
